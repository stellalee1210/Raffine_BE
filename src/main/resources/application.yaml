server:
  port :8080

spring:
  datasource:
    url: jdbc:h2:mem:springboot_practice;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
    enabled: true
    path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop   # 개발 중에는 create / create-drop / update 중 선택
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
