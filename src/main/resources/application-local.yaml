
server:
  port :8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:h2:file:./data/dbm;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      hibernate:
        ddl-auto: update   # 개발 중에는 create / create-drop / update 중 선택
      properties:
        hibernate:
          format_sql: true


app:
  upload-dir: ./data/uploads

logging:
  level:
    org.hibernate.SQL: debug